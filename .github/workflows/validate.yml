name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GLSL validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Check repository documents
        run: python3 tools/check_repository.py
      - name: Check shaders
        run: python3 tools/check_glsl.py
      - name: Check configuration
        run: python3 tools/configuration.py --check
      - name: Check packaging
        run: python3 tools/build_release.py --shader-only
      - uses: actions/upload-artifact@v4
        with:
          name: shader-package
          path: dist/releases/*/*
