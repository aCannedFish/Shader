# SimpleShader rendering directives and option pages.
# Values and allowed ranges are declared beside each setting in settings.glsl.
# Labels are localized in lang/; the loader persists user selections.
# Subpages use square brackets in screen definitions.

# 画质预设：只调成本相关选项，色彩与强度不变。MEDIUM 等于默认值；更高档位保留全部效果并提高采样与范围。
profile.LOW = ATMOSPHERE_STEPS=6 AURORA_STEPS=8 MATERIAL_REFLECTION_STEPS=16 VOLUMETRIC_RESOLUTION=0 AIR_SCATTER_STEPS=16 WATER_SHAFT_STEPS=8 BLOOM_RESOLUTION=0 SHADOW_SOFTNESS=0 shadowMapResolution=1024 shadowDistance=64.0 CLOUD_QUALITY=0 SKY_SAMPLES=16 WATER_REFLECTION_CLOUDS=0 WATER_REFLECTION_STEPS=16 REFLECTION_OCCLUSION_STEPS=6 LOCAL_LIGHT_COUNT=16 LOCAL_SHADOW_RESOLUTION=64 LOCAL_SHADOW_UPDATES=1 GI_QUALITY=1
profile.MEDIUM = ATMOSPHERE_STEPS=10 AURORA_STEPS=12 MATERIAL_REFLECTION_STEPS=24 VOLUMETRIC_RESOLUTION=1 AIR_SCATTER_STEPS=32 WATER_SHAFT_STEPS=12 BLOOM_RESOLUTION=0 SHADOW_SOFTNESS=1 shadowMapResolution=2048 shadowDistance=96.0 CLOUD_QUALITY=2 SKY_SAMPLES=24 WATER_REFLECTION_CLOUDS=0 WATER_REFLECTION_STEPS=32 REFLECTION_OCCLUSION_STEPS=10 LOCAL_LIGHT_COUNT=32 LOCAL_SHADOW_RESOLUTION=128 LOCAL_SHADOW_UPDATES=2 GI_QUALITY=1
profile.HIGH = ATMOSPHERE_STEPS=16 AURORA_STEPS=12 MATERIAL_REFLECTION_STEPS=32 VOLUMETRIC_RESOLUTION=1 AIR_SCATTER_STEPS=32 WATER_SHAFT_STEPS=16 BLOOM_RESOLUTION=0 SHADOW_SOFTNESS=2 shadowMapResolution=3072 shadowDistance=128.0 CLOUD_QUALITY=2 SKY_SAMPLES=32 WATER_REFLECTION_CLOUDS=1 WATER_REFLECTION_STEPS=64 REFLECTION_OCCLUSION_STEPS=16 LOCAL_LIGHT_COUNT=64 LOCAL_SHADOW_RESOLUTION=128 LOCAL_SHADOW_UPDATES=4 GI_QUALITY=2
profile.ULTRA = ATMOSPHERE_STEPS=16 AURORA_STEPS=16 MATERIAL_REFLECTION_STEPS=48 VOLUMETRIC_RESOLUTION=1 AIR_SCATTER_STEPS=48 WATER_SHAFT_STEPS=24 BLOOM_RESOLUTION=1 SHADOW_SOFTNESS=2 shadowMapResolution=4096 shadowDistance=160.0 CLOUD_QUALITY=2 SKY_SAMPLES=32 WATER_REFLECTION_CLOUDS=1 WATER_REFLECTION_STEPS=64 REFLECTION_OCCLUSION_STEPS=16 LOCAL_LIGHT_COUNT=64 LOCAL_SHADOW_RESOLUTION=192 LOCAL_SHADOW_UPDATES=4 GI_QUALITY=3

# Main option pages
screen = <profile> [SHADOWS] [LIGHTING] [WORLD] [WATER] [MATERIALS] [VEGETATION] [POST] [DEBUG]

# 天空的基础层和日落叠层用 alpha 混合。
# 日月贴图是黑底不透明图，必须用加法混合让黑底不影响天空。
blend.gbuffers_skybasic=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured=ONE ONE ONE ONE
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# 分离水面数据与透明颜色。非水片元输出零 alpha，保留已经绘制的水面。
blend.gbuffers_water.colortex5=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex7=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# 不透明阶段结束后复用几何/光照附件；调试视图继续保留原始 G-Buffer。
#if DEBUG_VIEW == 0
blend.gbuffers_water.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex2=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#else
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
#endif
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# 天气之后 colortex0.a 保存背景透射率，雾色修正按同一比例作用于背景。
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
#if DEBUG_VIEW == 0
blend.gbuffers_weather.colortex1=ONE ONE ONE ONE
#endif
alphaTest.gbuffers_clouds=off
alphaTest.gbuffers_weather=off
# 低密度水面必须保留片元，避免加载器在输出处按 alpha 再次丢弃。
alphaTest.gbuffers_water=off

# 阴影颜色缓冲记录最近投影体的类别与颜色，必须直接覆盖而不是混合。
blend.shadow=off

# 体积云在合成阶段绘制，关闭原版云网格。
clouds=off
rain.depth=false
# Opaque splash particles must reach depth before the water metadata is drawn.
particles.before.deferred=true
# 按相机所在群系的降水类型平滑关闭沙漠和雪地积水。
uniform.float.rainBiome=smooth(91, if(in(biome_precipitation, 1), 1.0, 0.0), 6.0, 6.0)

# ---- 阴影 ----
screen.SHADOWS = ENABLE_SHADOWS SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_MAP_BIAS SHADOW_BIAS
screen.SHADOWS.columns = 2

# ---- 光照 ----
screen.LIGHTING = [LOCAL_LIGHTS] [GI] MIN_AMBIENT_LIGHT AMBIENT_STRENGTH SUNLIGHT_STRENGTH MOONLIGHT_STRENGTH NIGHT_AMBIENT_STRENGTH NIGHT_EXPOSURE SKY_TINT BLOCK_LIGHT_STRENGTH BLOCK_LIGHT_FALLOFF SMOOTH_BLOCK_LIGHT ENABLE_COLOURED_LIGHTING
screen.LIGHTING.columns = 2

# ---- 世界（雾与水面）----
screen.WORLD = VOLUMETRIC_RESOLUTION FOG_DENSITY [ATMOSPHERE] [WEATHER] [SKY] [CLOUDS] [DIMENSIONS]
screen.WORLD.columns = 2
screen.WEATHER = ENABLE_REALISTIC_RAIN ENABLE_RAIN_PUDDLES RAIN_PUDDLES_STRENGTH RAIN_RIPPLE_STRENGTH RAIN_FOG_STRENGTH
screen.WEATHER.columns = 2

# ---- 水体 ----
screen.WATER = UNDERWATER_MIN_VISIBILITY WATER_CAUSTICS_STRENGTH UNDERWATER_SHAFT_STRENGTH WATER_SHAFT_STEPS UNDERWATER_DENSITY UNDERWATER_DEPTH_DIMMING WATER_SURFACE_OPACITY WATER_TURBIDITY WATER_ABSORPTION WATER_REFRACTION_STRENGTH ENABLE_WATER_TEXTURE ENABLE_WATER_WAVES WATER_COLOR_LIGHTNESS WATER_ROUGHNESS WATER_REFLECTION_STRENGTH WATER_SPECULAR_STRENGTH WATER_REFLECTION_BRIGHTNESS WATER_REFLECTION_CLOUDS WATER_REFLECTION_STEPS REFLECTION_OCCLUSION_STEPS
screen.WATER.columns = 2

# ---- 植被 ----
screen.VEGETATION = FOLIAGE_TRANSLUCENCY ENABLE_FOLIAGE_WIND WIND_STRENGTH WIND_SPEED LEAF_SWAY_STRENGTH PLANT_SWAY_STRENGTH
screen.VEGETATION.columns = 2
sliders = ORE_GLOW_STRENGTH GROUND_FOG_STRENGTH GROUND_FOG_HEIGHT AURORA_STRENGTH TWILIGHT_STRENGTH NETHER_ATMOSPHERE END_ATMOSPHERE MATERIAL_REFLECTION_STRENGTH NETHER_AMBIENT END_AMBIENT NETHER_FOG_DENSITY END_FOG_DENSITY MIN_AMBIENT_LIGHT LENS_FLARE_STRENGTH CHROMATIC_ABERRATION_STRENGTH AIR_SCATTER_STRENGTH LOCAL_LIGHT_RADIUS LOCAL_SHADOW_SOFTNESS LOCAL_SHADOW_STRENGTH LIGHTING_UPDATE_INTERVAL GI_STRENGTH GI_REFLECTANCE NIGHT_AMBIENT_STRENGTH NIGHT_EXPOSURE SKY_HAZE SKY_EXPOSURE CELESTIAL_SIZE CLOUD_COVERAGE CLOUD_DENSITY CLOUD_BRIGHTNESS CLOUD_SHADOW_STRENGTH MOONLIGHT_STRENGTH BLOCK_LIGHT_FALLOFF CLOUD_NIGHT_BRIGHTNESS UNDERWATER_MIN_VISIBILITY WATER_CAUSTICS_STRENGTH UNDERWATER_SHAFT_STRENGTH WATER_SHAFT_STEPS UNDERWATER_DENSITY UNDERWATER_DEPTH_DIMMING WIND_STRENGTH WIND_SPEED LEAF_SWAY_STRENGTH PLANT_SWAY_STRENGTH WATER_SURFACE_OPACITY WATER_TURBIDITY WATER_ABSORPTION WATER_REFRACTION_STRENGTH WATER_COLOR_LIGHTNESS WATER_ROUGHNESS WATER_REFLECTION_STRENGTH WATER_SPECULAR_STRENGTH WATER_REFLECTION_BRIGHTNESS BLOCK_LIGHT_STRENGTH RAIN_PUDDLES_STRENGTH RAIN_FOG_STRENGTH

# 法线光照自行计算，顶点 RGB 仅保留染色，AO 单独作用于间接光。
oldLighting=false
separateAo=true

# ---- 后处理 ----
screen.POST = ENABLE_LENS_FLARE LENS_FLARE_STRENGTH ENABLE_CHROMATIC_ABERRATION CHROMATIC_ABERRATION_STRENGTH TONEMAP_MODE EXPOSURE SATURATION CONTRAST VIGNETTE ENABLE_BLOOM BLOOM_RESOLUTION BLOOM_THRESHOLD BLOOM_STRENGTH BLOOM_RADIUS ENABLE_DITHER
screen.POST.columns = 2

# ---- 调试 ----
screen.DEBUG = DEBUG_VIEW




# The small lookups reuse bloom buffers until bloom extraction starts.
texture.noise=textures/sky-noise.png
size.buffer.colortex13=1 1
scale.deferred=0.25
# Option macros are unavailable during the loader's first screen/profile scan.
#ifdef VOLUMETRIC_RESOLUTION
#if VOLUMETRIC_RESOLUTION == 0
scale.composite=0.25
scale.composite1=0.25
#else
scale.composite=0.5
scale.composite1=0.5
#endif
#else
scale.composite=0.5
scale.composite1=0.5
#endif
screen.SKY = SKY_HAZE SKY_EXPOSURE SKY_SAMPLES CELESTIAL_SIZE
screen.SKY.columns = 2
screen.CLOUDS = CLOUD_QUALITY CLOUD_COVERAGE CLOUD_DENSITY CLOUD_BRIGHTNESS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_SIZE CLOUD_SPEED CLOUD_SHADOW_STRENGTH CLOUD_NIGHT_BRIGHTNESS
screen.CLOUDS.columns = 2

# Companion controls configure independent raster maps and radiance transport.
screen.LOCAL_LIGHTS = ENABLE_COMPANION_LIGHTING ENABLE_LOCAL_SHADOWS LOCAL_LIGHT_COUNT LOCAL_LIGHT_RADIUS LOCAL_SHADOW_RESOLUTION LOCAL_SHADOW_UPDATES LOCAL_SHADOW_SOFTNESS LOCAL_SHADOW_STRENGTH LIGHTING_UPDATE_INTERVAL
screen.LOCAL_LIGHTS.columns = 2
screen.GI = GI_QUALITY GI_MULTIBOUNCE GI_STRENGTH GI_REFLECTANCE
screen.GI.columns = 2

# 泛光视口与 bloomSize() 保持一致，缓冲仍按全场景尺寸分配以供前序复用。
#if BLOOM_RESOLUTION == 0
scale.composite3=0.5
scale.composite4=0.5
scale.composite5=0.5
#else
scale.composite3=1.0
scale.composite4=1.0
scale.composite5=1.0
#endif

# Surface materials and non-overworld environments have independent budgets.
screen.MATERIALS = ENABLE_MATERIAL_REFLECTIONS MATERIAL_REFLECTION_STRENGTH MATERIAL_REFLECTION_STEPS ORE_GLOW_STRENGTH
screen.MATERIALS.columns = 2
screen.DIMENSIONS = NETHER_AMBIENT NETHER_FOG_DENSITY END_AMBIENT END_FOG_DENSITY
screen.DIMENSIONS.columns = 2
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false

# Atmospheric additions share the existing volume and sky cache budgets.
screen.ATMOSPHERE = GROUND_FOG_STRENGTH GROUND_FOG_HEIGHT ATMOSPHERE_STEPS AURORA_STRENGTH AURORA_SPEED AURORA_STEPS TWILIGHT_STRENGTH NETHER_ATMOSPHERE END_ATMOSPHERE AIR_SCATTER_STRENGTH AIR_SCATTER_STEPS
screen.ATMOSPHERE.columns = 2
