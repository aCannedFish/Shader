# SimpleShader rendering directives and option pages.
# Values and allowed ranges are declared beside each setting in settings.glsl.
# Labels are localized in lang/; the loader persists user selections.
# Subpages use square brackets in screen definitions.

# 画质预设：只调成本相关选项，色彩与强度不变。MEDIUM 等于默认值；更高档位保留全部效果并提高采样与范围。
profile.LOW = SHADOW_SOFTNESS=0 shadowMapResolution=1024 shadowDistance=64.0 CLOUD_QUALITY=0 SKY_SAMPLES=16 WATER_REFLECTION_CLOUDS=0 WATER_REFLECTION_STEPS=16 LOCAL_LIGHT_COUNT=16 LOCAL_SHADOW_RESOLUTION=64 LOCAL_SHADOW_UPDATES=1 GI_VOLUME_SIZE=24 GI_BOUNCES=1 GI_PROPAGATION_STEPS=4 GI_WORK_PER_FRAME=2
profile.MEDIUM = SHADOW_SOFTNESS=1 shadowMapResolution=2048 shadowDistance=96.0 CLOUD_QUALITY=2 SKY_SAMPLES=24 WATER_REFLECTION_CLOUDS=0 WATER_REFLECTION_STEPS=32 LOCAL_LIGHT_COUNT=32 LOCAL_SHADOW_RESOLUTION=128 LOCAL_SHADOW_UPDATES=2 GI_VOLUME_SIZE=32 GI_BOUNCES=3 GI_PROPAGATION_STEPS=8 GI_WORK_PER_FRAME=4
profile.HIGH = SHADOW_SOFTNESS=2 shadowMapResolution=3072 shadowDistance=128.0 CLOUD_QUALITY=2 SKY_SAMPLES=32 WATER_REFLECTION_CLOUDS=1 WATER_REFLECTION_STEPS=64 LOCAL_LIGHT_COUNT=64 LOCAL_SHADOW_RESOLUTION=128 LOCAL_SHADOW_UPDATES=4 GI_VOLUME_SIZE=40 GI_BOUNCES=4 GI_PROPAGATION_STEPS=12 GI_WORK_PER_FRAME=8
profile.ULTRA = SHADOW_SOFTNESS=2 shadowMapResolution=4096 shadowDistance=160.0 CLOUD_QUALITY=2 SKY_SAMPLES=32 WATER_REFLECTION_CLOUDS=1 WATER_REFLECTION_STEPS=64 LOCAL_LIGHT_COUNT=64 LOCAL_SHADOW_RESOLUTION=192 LOCAL_SHADOW_UPDATES=4 GI_VOLUME_SIZE=48 GI_BOUNCES=6 GI_PROPAGATION_STEPS=16 GI_WORK_PER_FRAME=8

# Main option pages
screen = <profile> [SHADOWS] [LIGHTING] [WORLD] [WATER] [VEGETATION] [POST] [DEBUG]

# 天空的基础层和日落叠层用 alpha 混合。
# 日月贴图是黑底不透明图，必须用加法混合让黑底不影响天空。
blend.gbuffers_skybasic=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured=ONE ONE ONE ONE
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex5=off
blend.gbuffers_water.colortex7=off
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
alphaTest.gbuffers_clouds=off
# 低密度水面必须保留片元，避免加载器在输出处按 alpha 再次丢弃。
alphaTest.gbuffers_water=off

# 阴影颜色缓冲记录最近投影体的类别与颜色，必须直接覆盖而不是混合。
blend.shadow=off

# 体积云在合成阶段绘制，关闭原版云网格。
clouds=off

# ---- 阴影 ----
screen.SHADOWS = ENABLE_SHADOWS SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_MAP_BIAS SHADOW_BIAS
screen.SHADOWS.columns = 2

# ---- 光照 ----
screen.LIGHTING = [LOCAL_LIGHTS] [GI] MIN_AMBIENT_LIGHT AMBIENT_STRENGTH SUNLIGHT_STRENGTH MOONLIGHT_STRENGTH NIGHT_AMBIENT_STRENGTH NIGHT_EXPOSURE SKY_TINT BLOCK_LIGHT_STRENGTH BLOCK_LIGHT_FALLOFF SMOOTH_BLOCK_LIGHT ENABLE_COLOURED_LIGHTING
screen.LIGHTING.columns = 2

# ---- 世界（雾与水面）----
screen.WORLD = FOG_DENSITY AIR_SCATTER_STRENGTH [SKY] [CLOUDS]
screen.WORLD.columns = 2

# ---- 水体 ----
screen.WATER = UNDERWATER_MIN_VISIBILITY WATER_CAUSTICS_STRENGTH UNDERWATER_SHAFT_STRENGTH UNDERWATER_DENSITY UNDERWATER_DEPTH_DIMMING WATER_SURFACE_OPACITY WATER_TURBIDITY WATER_ABSORPTION WATER_REFRACTION_STRENGTH ENABLE_WATER_TEXTURE ENABLE_WATER_WAVES WATER_COLOR_LIGHTNESS WATER_ROUGHNESS WATER_REFLECTION_STRENGTH WATER_SPECULAR_STRENGTH WATER_REFLECTION_BRIGHTNESS WATER_REFLECTION_CLOUDS WATER_REFLECTION_STEPS
screen.WATER.columns = 2

# ---- 植被 ----
screen.VEGETATION = ENABLE_FOLIAGE_WIND WIND_STRENGTH WIND_SPEED LEAF_SWAY_STRENGTH PLANT_SWAY_STRENGTH
screen.VEGETATION.columns = 2
sliders = MIN_AMBIENT_LIGHT LENS_FLARE_STRENGTH CHROMATIC_ABERRATION_STRENGTH AIR_SCATTER_STRENGTH LOCAL_LIGHT_RADIUS LOCAL_SHADOW_SOFTNESS LOCAL_SHADOW_STRENGTH LIGHTING_UPDATE_INTERVAL GI_STRENGTH GI_REFLECTANCE NIGHT_AMBIENT_STRENGTH NIGHT_EXPOSURE SKY_HAZE SKY_EXPOSURE CELESTIAL_SIZE CLOUD_COVERAGE CLOUD_DENSITY CLOUD_BRIGHTNESS CLOUD_SHADOW_STRENGTH MOONLIGHT_STRENGTH BLOCK_LIGHT_FALLOFF CLOUD_NIGHT_BRIGHTNESS UNDERWATER_MIN_VISIBILITY WATER_CAUSTICS_STRENGTH UNDERWATER_SHAFT_STRENGTH UNDERWATER_DENSITY UNDERWATER_DEPTH_DIMMING WIND_STRENGTH WIND_SPEED LEAF_SWAY_STRENGTH PLANT_SWAY_STRENGTH WATER_SURFACE_OPACITY WATER_TURBIDITY WATER_ABSORPTION WATER_REFRACTION_STRENGTH WATER_COLOR_LIGHTNESS WATER_ROUGHNESS WATER_REFLECTION_STRENGTH WATER_SPECULAR_STRENGTH WATER_REFLECTION_BRIGHTNESS BLOCK_LIGHT_STRENGTH

# 法线光照自行计算，顶点 RGB 仅保留染色，AO 单独作用于间接光。
oldLighting=false
separateAo=true

# ---- 后处理 ----
screen.POST = ENABLE_LENS_FLARE LENS_FLARE_STRENGTH ENABLE_CHROMATIC_ABERRATION CHROMATIC_ABERRATION_STRENGTH TONEMAP_MODE EXPOSURE SATURATION CONTRAST VIGNETTE ENABLE_BLOOM BLOOM_THRESHOLD BLOOM_STRENGTH BLOOM_RADIUS ENABLE_DITHER
screen.POST.columns = 2

# ---- 调试 ----
screen.DEBUG = DEBUG_VIEW




# The small lookups reuse bloom buffers until bloom extraction starts.
texture.noise=textures/sky-noise.png
scale.deferred=0.25
scale.composite=0.5
scale.composite1=0.5
screen.SKY = SKY_HAZE SKY_EXPOSURE SKY_SAMPLES CELESTIAL_SIZE
screen.SKY.columns = 2
screen.CLOUDS = CLOUD_QUALITY CLOUD_COVERAGE CLOUD_DENSITY CLOUD_BRIGHTNESS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_SIZE CLOUD_SPEED CLOUD_SHADOW_STRENGTH CLOUD_NIGHT_BRIGHTNESS
screen.CLOUDS.columns = 2

# Companion controls configure independent raster maps and radiance transport.
screen.LOCAL_LIGHTS = ENABLE_COMPANION_LIGHTING ENABLE_LOCAL_SHADOWS LOCAL_LIGHT_COUNT LOCAL_LIGHT_RADIUS LOCAL_SHADOW_RESOLUTION LOCAL_SHADOW_UPDATES LOCAL_SHADOW_SOFTNESS LOCAL_SHADOW_STRENGTH LIGHTING_UPDATE_INTERVAL
screen.LOCAL_LIGHTS.columns = 2
screen.GI = GI_BOUNCES GI_VOLUME_SIZE GI_PROPAGATION_STEPS GI_WORK_PER_FRAME GI_STRENGTH GI_REFLECTANCE
screen.GI.columns = 2
